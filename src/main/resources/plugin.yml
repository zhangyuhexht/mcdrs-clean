name: MCDRSClean
version: ${version}
main: top.mcdrsclean.MCDRSClean
api-version: '26.3'
softdepend:
  - PlaceholderAPI
authors: [ MCDRSClean ]
description: MCDRS Clean - lightweight entity cleanup plugin
commands:
  mcdrsclean:
    description: Main plugin command
    aliases:
      - mcdrs
      - mc
permissions:
  mcdrs.admin:
    default: op
    description: Allows use of plugin admin commands
  mcdrs.clean:
    default: op
    description: Allows execution of cleanup commands
  mcdrs.trash:
    default: op
    description: Allows opening the trash can