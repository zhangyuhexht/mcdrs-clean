prefix: "&7[&aMCDRS Clean&7]"
debug_prefix: "&7[&6MCDRSDebug&7]"

debug:
  console_enable: "&fDebug output &aenabled&f temporarily (edit config.yml to make it permanent). You will receive &bdebug&f messages until the next restart. Run this command again to &cdisable&f."
  console_disable: "&fDebug output &cdisabled&f temporarily (edit config.yml to make it permanent). You will not receive &bdebug&f messages until the next restart. Run this command again to &aenable&f."
  player_enable: "&fDebug output &aenabled&f for you. You will receive &bdebug&f messages. Run this command again to &cdisable&f."
  player_disable: "&fDebug output &cdisabled&f for you. You will not receive &bdebug&f messages. Run this command again to &aenable&f."

warn:
  out_of_range: "The countdown message `{message}` is set to a delay longer than the cleanup interval `{duration}`. Please fix it in the config; this message will not be sent."
  invalid_number: "Countdown message delays must be numbers smaller than the cleanup interval"

hook:
  enable: "Found dependency {plugin}, enabling support"
  disable: "Dependency {plugin} not found, support disabled"

message:
  noperm: "&cNo permission"
  non_player: "&cPlayers only"
  unknown_command: "&cUnknown command"
  invalid_args: "&cInvalid arguments"
  invalid_world: "&cWorld `{world}` does not exist"
  invalid_number: "{number} is not a valid number"
  invalid_config: "&cConfig file `{file}` is malformed"
  invalid_entity_type: "&e{type}&c is not a valid entity type"

menu:
  dense:
    title: "&6Dense entity check"
    item:
      name: "&6{type}"
      lore: |-
        &f{amount}
        &f{chunk}
        &aLeft-click to teleport
        &4Right-click to remove all of this entity in the chunk
    prev:
      name: "&6Previous page"
      lore: |-
        &fClick to go to the previous page
    next:
      name: "&6Next page"
      lore: |-
        &fClick to go to the next page
    temp:
      name: "&6Click to toggle temporary teleport"
      lore: |-
        &fYou will be teleported back 30s after arriving
        &fTemporary teleport is a toggle; once enabled it applies to the next teleport only
        &fCurrent status: {status}
      status:
        true: "&aEnabled"
        false: "&cDisabled"
    clean: "Removed {count} {type} from chunk ({chunk})"
  trashcan:
    title: "&6Temporary trash can"
    item:
      # Lore shown on the item
      lore: |-
        &f{amount} in total
        &aLeft-click to take one
        &aRight-click to take half a stack
        &aShift+left-click to take a full stack
    prev:
      name: "&6Previous page"
      lore: |-
        &fClick to go to the previous page
    next:
      name: "&6Next page"
      lore: |-
        &fClick to go to the next page

trash:
  title: "&6Trash can, &4items cannot be recovered once closed"

command:
  reload_done: "&aReload complete"
  trash_disable: "&aThe trash can is disabled"
  trash_open: "&aOpened the trash can"
  trash_clean_done: "&aTrash can cleared"
  clean_confirm: "&eThis will clean the whole server. Run this command again within &c10 seconds&e to confirm"
  clean_started: "&aCleanup started, running in batches"
  clean_done_all: "&aCleanup finished"
  clean_done: "&aRemoved &6{count}&a entities"
  teleport:
    done: "&aTeleport complete"
    temp: "&aTeleport complete, returning you to your previous location in 30 seconds"
    cover: "&aTeleport complete, returning you to the previous teleport's return location"
    back: "&aReturned to your location before teleporting"
  stats:
    spacing: "&7, "
    content: "&f{type}: {count}"
    empty: "&cNo results"

    # {force} is the number of force-loaded chunks (1.13+; always enabled in this 26.3 branch)
    world: |-
      &fWorld &a{world}&f has {count} chunks loaded ({force} force-loaded)
      &bEntity statistics:
      {entity}
    entity: |-
      &fStatistics for entity &e{type}&f
      {entity}
  usage:
    debug: "&a/mcdrsclean debug &ftoggle whether you receive debug messages"
    reload: "&a/mcdrsclean reload &freload the plugin"
    trash: "&a/mcdrsclean trash &fopen the trash can"
    players: "&a/mcdrsclean players &flist online players and their positions"
    show: "&a/mcdrsclean show &fopen the dense entity statistics menu"
    stats: |-
      &a/mcdrsclean stats &fentity and chunk statistics for your current world
      &a/mcdrsclean stats <world> &fentity and chunk statistics for a world
    entity: |-
      &a/mcdrsclean entity <entity> &fper-chunk counts of an entity in the current world
      &a/mcdrsclean entity <entity> <world> &fper-chunk counts of an entity in a world
      &a/mcdrsclean entity <entity> <world> <min-count> &fper-chunk counts, hiding chunks at or below min-count
    clean: |-
      &a/mcdrsclean clean &frun a full cleanup now (sends the finish message, follows config rules)
      &a/mcdrsclean clean entity &frun a living entity cleanup now (sends the finish message)
      &a/mcdrsclean clean entity <world> &frun a living entity cleanup in a world (&cno&f finish message)
      &a/mcdrsclean clean drop &frun a dropped item cleanup now (sends the finish message)
      &a/mcdrsclean clean drop <world> &frun a dropped item cleanup in a world (&cno&f finish message)
      &a/mcdrsclean clean chunk &frun a dense entity cleanup now (sends the finish message)
      &a/mcdrsclean clean chunk <world> &frun a dense entity cleanup in a world (&cno&f finish message)
