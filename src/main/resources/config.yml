# Set to true to print detailed check information to the console
debug: false

# Kept only for compatibility with old config files; MCDRS Clean no longer checks for updates
update: false

# Whether to report stats to bstats (requires your own bstatsId in MCDRSClean.kt, otherwise nothing is sent)
bstats: false

# Batched cleanup: number of entities handled per tick
# Lower values keep each tick lighter but take longer overall; tune this on high-entity servers
batch_size: 200

# Seconds between cleanups
duration: 600

# Also print countdown and cleanup broadcasts to the console / log file
# false (default): messages go to online players only, no console spam or log bloat
# true: restore the old behaviour and print every broadcast to the console
console_broadcast: false

# Messages shown before a cleanup
# Format: seconds remaining: message
# e.g. 60: entities will be cleaned in 1 minute
message:
  60: "&fEntities will be cleaned in 1 minute"
  30: "&fEntities will be cleaned in 30 seconds"
  10: "&fEntities will be cleaned in 10 seconds"
  0: "&fCleaning now"

# Clean up living entities
# Zombies, cows, and so on. Item frames, snowballs, etc. are not included
living:
  # Set to true to enable
  enable: true

  # Worlds to skip (no regex)
  disable_world:
    - "world-to-skip"

  # Message shown after cleanup (set to "" to disable)
  finish: "&aLiving entity cleanup finished, removed {clean}/{all}"

  settings:
    # Set to true to remove named entities
    # Set to false to leave them alone
    name: false
    # Set to true to remove leashed entities
    # Set to false to leave them alone
    lead: false
    # Set to true to remove entities riding another entity (a mob in a boat, a player on a horse)
    # Set to false to leave them alone
    mount: false

  # true: blacklist mode (only matching entities are removed)
  # false: whitelist mode (matching entities are kept)
  is_black: true

  # Entity types to clean (regex supported)
  # Every entity matching here and passing the settings above will be removed
  # https://hub.spigotmc.org/javadocs/spigot/org/bukkit/entity/EntityType.html
  match:
    - "BLAZE"
    - "EVOKER"
    - "GHAST"
    - "(GLOW_)?SQUID"
    - "PHANTOM"
    - "PILLAGER"

# Clean up dropped items
drop:
  # Set to true to enable
  enable: true

  # Worlds to skip (no regex)
  disable_world:
    - "world-to-skip"

  # Message shown after cleanup (set to "" to disable)
  finish: "&aDropped item cleanup finished, removed {clean}/{all}"

  # true: blacklist mode (only matching items are removed)
  # false: whitelist mode (matching items are kept)
  is_black: false

  # true: keep enchanted items; false: remove them
  enchant: false

  # true: keep items with lore; false: remove them
  lore: false

  # true: keep written books; false: remove them (also requires a match rule)
  written_book: false

  # Item types to clean (regex supported)
  # https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Material.html
  match:
    - "DIAMOND[A-Z_]*"
    - "NETHERITE[A-Z_]*"
    - "[A-Z_]*SHULKER_BOX"
    - "[A-Z_]*(HEAD|SKULL)"
    - "SHULKER_SHELL"
    - "BEACON"
    - "(ENCHANTED_)?GOLDEN_APPLE"
    - "TRIDENT"
    - "TOTEM_OF_UNDYING"
    - "ENDER_CHEST"
    - "DRAGON_EGG"
    - "ELYTRA"

# Chunk checks (dense entity cleanup)
chunk:
  # Set to true to enable
  enable: true

  # Worlds to skip (no regex)
  disable_world:
    - "world-to-skip"

  # Message shown after cleanup (set to "" to disable)
  finish: "&aDense entity cleanup finished, removed {clean}"

  settings:
    # Set to true to remove named entities
    # Set to false to leave them alone
    name: false
    # Set to true to remove leashed entities
    # Set to false to leave them alone
    lead: false
    # Set to true to remove entities riding another entity (a mob in a boat, a player on a horse)
    # Set to false to leave them alone
    mount: false

  # Alert threshold for entities left behind
  # Notify when a chunk has more than this many of a given entity
  count: 50

  # Message format (sent to players with the mcdrs.admin permission)
  format: "Too many {entity} in {chunk} ({count})"

  # Per-chunk entity limits (regex)
  # All matching types share the same limit
  # Entities above the limit are removed
  # https://hub.spigotmc.org/javadocs/spigot/org/bukkit/entity/EntityType.html
  limit:
    # Hostile mobs
    ZOMBIE|SKELETON: 10
    SPIDER: 2
    # Passive mobs
    CHICKEN|PIG|COW|SHEEP: 50
    # Projectiles
    EGG|ENDER_PEARL|EXPERIENCE_ORB|FIREBALL|FIREWORK|SMALL_FIREBALL|SNOWBALL|ARROW|SPECTRAL_ARROW|SPLASH_POTION: 10

# Shared trash can settings
trashcan:
  # Set to false to disable the shared trash can
  enable: true
  # Set to true to collect items removed by the dropped-item cleanup
  collect: true
  # Seconds between trash clears. Leave empty to disable automatic clearing
  # (items can accumulate and use a lot of memory)
  duration: 6000
  despawn:
    # Set to true to recover items that are about to despawn
    enable: false
    # Worlds to skip (regex supported)
    disable_world:
      - "world-to-skip"
    # Item types collected into the trash can (regex supported)
    # Use the following to collect everything:
    # match:
    #   - .*
    # https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Material.html
    match:
      - "DIAMOND[A-Z_]*"
      - "NETHERITE[A-Z_]*"
      - "[A-Z_]*SHULKER_BOX"
      - "[A-Z_]*(HEAD|SKULL)"
      - "SHULKER_SHELL"
      - "BEACON"
      - "(ENCHANTED_)?GOLDEN_APPLE"
      - "TRIDENT"
      - "TOTEM_OF_UNDYING"
      - "ENDER_CHEST"
      - "DRAGON_EGG"
      - "ELYTRA"

# Behaviour when nobody is online
no_online:
  # Set to false to skip messages when there are no online players (countdown and results)
  message: true
  # Set to false to skip cleaning when nobody is online (the countdown still shows)
  clean: true
